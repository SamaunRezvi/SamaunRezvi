name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: 3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./.github/3d-contrib-settings.json

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && exit 0
          git commit -m "chore: regenerate 3d contribution graph"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
