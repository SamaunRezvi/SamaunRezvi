<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-label="3D animated banner">

  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#0f2a18"/>
      <stop offset="55%" stop-color="#0d1a12"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56D364"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#0f3d1e"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#123f21"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3FB950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="card">
      <rect x="1" y="1" width="518" height="698" rx="14"/>
    </clipPath>
    <clipPath id="floor">
      <rect x="1" y="430" width="518" height="269"/>
    </clipPath>
  </defs>

  <!-- ── card ─────────────────────────────────────────────── -->
  <rect x="1" y="1" width="518" height="698" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#card)">

    <!-- ambient light pools -->
    <ellipse cx="260" cy="300" rx="180" ry="170" fill="#238636" opacity="0.13" filter="url(#softglow)">
      <animate attributeName="opacity" values="0.09;0.18;0.09" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ── perspective floor ──────────────────────────────── -->
    <g clip-path="url(#floor)" opacity="0.5">
      <!-- converging rails -->
      <g stroke="#238636" stroke-width="1" opacity="0.45">
        <line x1="260" y1="430" x2="-360" y2="700"/>
        <line x1="260" y1="430" x2="-140" y2="700"/>
        <line x1="260" y1="430" x2="20"   y2="700"/>
        <line x1="260" y1="430" x2="150"  y2="700"/>
        <line x1="260" y1="430" x2="260"  y2="700"/>
        <line x1="260" y1="430" x2="370"  y2="700"/>
        <line x1="260" y1="430" x2="500"  y2="700"/>
        <line x1="260" y1="430" x2="660"  y2="700"/>
        <line x1="260" y1="430" x2="880"  y2="700"/>
      </g>
      <!-- scan lines travelling toward the viewer -->
      <g stroke="#3FB950" stroke-width="1.4">
        <line x1="-400" y1="0" x2="920" y2="0" opacity="0.9">
          <animateTransform attributeName="transform" type="translate"
            values="0 440;0 700" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" repeatCount="indefinite"/>
        </line>
        <line x1="-400" y1="0" x2="920" y2="0" opacity="0.9">
          <animateTransform attributeName="transform" type="translate"
            values="0 440;0 700" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
        </line>
        <line x1="-400" y1="0" x2="920" y2="0" opacity="0.9">
          <animateTransform attributeName="transform" type="translate"
            values="0 440;0 700" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- horizon glow -->
      <rect x="0" y="428" width="520" height="3" fill="url(#fade)" opacity="0.7"/>
    </g>

    <!-- ── orbits ─────────────────────────────────────────── -->
    <g transform="translate(260 300)" fill="none" stroke="#2EA043" opacity="0.55">
      <ellipse rx="190" ry="62" stroke-width="1.2">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="160" ry="52" stroke-width="1" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="13s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="205" ry="80" stroke-width="0.9" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate"
          from="120" to="480" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- orbiting satellites -->
    <g transform="translate(260 300)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <circle cx="190" cy="0" r="4.5" fill="#7EE787" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="180" to="540" dur="10.5s" repeatCount="indefinite"/>
        <circle cx="-160" cy="0" r="3.2" fill="#56D364" filter="url(#glow)"/>
      </g>
    </g>

    <!-- ── rotating isometric cube ────────────────────────── -->
    <g transform="translate(260 300)">
      <!-- float -->
      <animateTransform attributeName="transform" type="translate"
        values="260 292;260 312;260 292" dur="5.5s" repeatCount="indefinite" additive="replace"/>

      <g>
        <!-- full spin -->
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="16s" repeatCount="indefinite"/>

        <!-- outer cube -->
        <g stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round">
          <polygon points="0,-110 95,-55 0,0 -95,-55" fill="url(#faceTop)" opacity="0.92">
            <animate attributeName="opacity" values="0.92;0.72;0.92" dur="4s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="-95,-55 0,0 0,110 -95,55" fill="url(#faceLeft)" opacity="0.88"/>
          <polygon points="95,-55 0,0 0,110 95,55" fill="url(#faceRight)" opacity="0.88">
            <animate attributeName="opacity" values="0.88;0.62;0.88" dur="4s" begin="2s" repeatCount="indefinite"/>
          </polygon>
        </g>

        <!-- wireframe over the solid -->
        <g fill="none" stroke="#7EE787" stroke-width="1.3" opacity="0.85" filter="url(#glow)">
          <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"/>
          <path d="M0,-110 L0,0 M-95,-55 L0,0 M95,-55 L0,0 M0,0 L0,110"/>
        </g>

        <!-- vertex nodes -->
        <g fill="#A2F2B0">
          <circle cx="0" cy="-110" r="3.4"/>
          <circle cx="95" cy="-55" r="3.4"/>
          <circle cx="95" cy="55" r="3.4"/>
          <circle cx="0" cy="110" r="3.4"/>
          <circle cx="-95" cy="55" r="3.4"/>
          <circle cx="-95" cy="-55" r="3.4"/>
          <circle cx="0" cy="0" r="3.4"/>
          <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- inner counter-rotating core -->
      <g fill="none" stroke="#3FB950" stroke-width="1.1" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"/>
        <path d="M0,-46 L0,0 M-40,-23 L0,0 M40,-23 L0,0"/>
      </g>
    </g>

    <!-- cube shadow on the floor -->
    <ellipse cx="260" cy="470" rx="96" ry="20" fill="#238636" opacity="0.28" filter="url(#softglow)">
      <animate attributeName="rx" values="96;80;96" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.18;0.3" dur="5.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ── drifting particles ─────────────────────────────── -->
    <g fill="#3FB950">
      <circle cx="62" cy="620" r="2">
        <animate attributeName="cy" values="640;70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="620" r="1.6">
        <animate attributeName="cy" values="660;90" dur="11s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="392" cy="620" r="2.2">
        <animate attributeName="cy" values="650;60" dur="10s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="466" cy="620" r="1.5">
        <animate attributeName="cy" values="670;110" dur="13s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="620" r="1.4">
        <animate attributeName="cy" values="680;140" dur="12s" begin="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ── corner brackets ────────────────────────────────── -->
    <g fill="none" stroke="#238636" stroke-width="1.6" opacity="0.8">
      <path d="M18 46 L18 18 L46 18"/>
      <path d="M474 18 L502 18 L502 46"/>
      <path d="M502 654 L502 682 L474 682"/>
      <path d="M46 682 L18 682 L18 654"/>
    </g>

    <!-- ── caption ────────────────────────────────────────── -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" text-anchor="middle">
      <text x="260" y="600" fill="#3FB950" font-size="13" letter-spacing="4">SAMAUN REZVI</text>
      <text x="260" y="624" fill="#6E7681" font-size="10.5" letter-spacing="2.2">
        NINE ROLES · NINETY ROUTES · ONE PERSON
      </text>
      <text x="260" y="652" fill="#56D364" font-size="10.5" letter-spacing="1.6" opacity="0.9">
        ● building
        <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.2s" repeatCount="indefinite"/>
      </text>
    </g>

  </g>

  <rect x="1" y="1" width="518" height="698" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
